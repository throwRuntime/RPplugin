name: GikyMessage build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Checkout GikyMessage
      uses: actions/checkout@v4
      with:
        repository: groundbreakingmc/GikyMessage
        path: giky-message-src

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build and Publish GikyMessage to local lib folder
      run: |
        cd giky-message-src
        chmod +x gradlew
        ./gradlew publish -Ppublishing.repository.url=file://${{ github.workspace }}/lib

    - name: Push local Maven repository changes
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "chore: auto-update local maven repo artifacts [skip ci]"
        file_pattern: 'lib/**'

    - name: Build plugin
      run: mvn clean package --batch-mode

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RPplugin
        path: target/RPplugin-*.jar

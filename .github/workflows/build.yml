name: GikyMessage build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout RPplugin
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Checkout GikyMessage
        uses: actions/checkout@v4
        with:
          repository: groundbreakingmc/GikyMessage
          path: giky-message-src
          fetch-depth: 1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Get GikyMessage revision
        id: giky
        working-directory: giky-message-src
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache GikyMessage artifact
        id: cache-giky
        uses: actions/cache@v4
        with:
          path: lib/com/github/groundbreakingmc/GikyMessage
          key: giky-message-${{ steps.giky.outputs.sha }}

      - name: Build GikyMessage
        if: steps.cache-giky.outputs.cache-hit != 'true'
        working-directory: giky-message-src
        run: ./gradlew publishToMavenLocal --no-daemon

      - name: Copy GikyMessage artifact
        if: steps.cache-giky.outputs.cache-hit != 'true'
        shell: bash
        run: |
          rm -rf lib/com/github/groundbreakingmc/GikyMessage
          mkdir -p lib/com/github/groundbreakingmc

          cp -r \
            "$HOME/.m2/repository/com/github/groundbreakingmc/GikyMessage" \
            lib/com/github/groundbreakingmc/

      - name: Commit updated GikyMessage
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update GikyMessage [skip ci]"
          file_pattern: lib/**
          branch: ${{ github.ref_name }}

      - name: Build RPplugin
        run: mvn package --batch-mode

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: RPplugin
          path: target/RPplugin-*.jar
